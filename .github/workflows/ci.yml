name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # rpaper — 연구 논문 파이프라인 테스트
  rpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q

  # patent_pipeline — 특허 작성 파이프라인 검증 (API 키 불필요)
  patent-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all modules
        run: python -m py_compile patent_pipeline/*.py patent_pipeline/*/*.py
      - name: Run offline tests (no API keys required)
        run: python tests/test_offline.py
      - name: Smoke test the CLI (dry-run, no keys)
        run: |
          python -m patent_pipeline check || true
          python -m patent_pipeline run --dry-run --file examples/idea_example.md --vault /tmp/ci_vault
